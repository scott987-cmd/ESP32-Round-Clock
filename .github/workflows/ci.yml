name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt bandit==1.9.4 pip-audit==2.10.1
      - run: python -m unittest discover -s server -p 'test_*.py'
      - run: python tools/test_content_pack.py
      - run: python tools/test_english_assets.py
      - run: python tools/test_notification_store.py
      - run: cc -Wall -Wextra -Werror -I main tools/test_reset_notice_state.c -o /tmp/test-reset-notices && /tmp/test-reset-notices
      - run: bandit -q -r server macos/QuotaSync tools -x 'tools/test_*,server/test_*' -ll
      - run: pip-audit -r requirements.txt
      - run: python tools/check_public_tree.py

  macos-helper:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test -c release --package-path macos/RoundTextBridge
