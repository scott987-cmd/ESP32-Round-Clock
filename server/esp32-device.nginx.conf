limit_req_zone $binary_remote_addr zone=round_clock_api:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=round_clock_models:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=round_clock_connections:1m;

server {
    listen 8080 ssl;
    server_name device-api.example.com;
    server_tokens off;

    ssl_certificate /etc/esp32-device-tls/server.pem;
    ssl_certificate_key /etc/esp32-device-tls/server.key;
    ssl_client_certificate /etc/esp32-device-tls/device-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 20s;
    keepalive_timeout 20s;
    reset_timedout_connection on;
    limit_conn round_clock_connections 8;
    limit_conn_status 429;
    limit_req zone=round_clock_api burst=30 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /healthz {
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/weather {
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/quota {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/agents {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/notes {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/avatars {
        client_max_body_size 154k;
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/library {
        client_max_body_size 1k;
        proxy_read_timeout 90s;
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/stories {
        client_max_body_size 1k;
        proxy_read_timeout 90s;
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/pet {
        client_max_body_size 2k;
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/codex-reset {
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/music {
        limit_req zone=round_clock_api burst=30 nodelay;
        limit_req zone=round_clock_models burst=2 nodelay;
        client_max_body_size 4k;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/music/latest {
        proxy_read_timeout 90s;
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/wallpaper {
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/wallpaper/generate {
        limit_req zone=round_clock_api burst=30 nodelay;
        limit_req zone=round_clock_models burst=2 nodelay;
        client_max_body_size 4k;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:18080;
    }

    location = /v1/transcribe {
        client_max_body_size 700k;
        proxy_read_timeout 90s;
        proxy_pass http://127.0.0.1:18080;
    }

    location / {
        return 404;
    }
}
